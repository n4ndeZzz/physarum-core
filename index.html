<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisón · Luis7Lunes — singularidades</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#050403;font-family:'Courier New',monospace;color:#eee;}

<body>
<canvas id="glcanvas"></canvas>
<audio id="bgm" src="assets/musica.mp3" preload="auto"></audio>
<div id="hud">
  <h1>sisón / luis7lunes — en vivo</h1>
  <div class="row"><label>SISÓN · orden (q/a)</label><span id="hud-sd">—</span></div>
  <div class="row"><label>LUIS7LUNES · caos (w/s)</label><span id="hud-sa">—</span></div>
  <div class="row"><label>TENSIÓN (e/d)</label><span id="hud-ra">—</span></div>

  <div class="row"><label>PERSISTENCIA (↑/↓)</label><span id="hud-decay">—</span></div>

</div>
<div id="startHint">ENTER — comenzar</div>
<script>
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2');
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:20px">WebGL2 no disponible.</p>'; throw new Error('no webgl2'); }

const extFloat = gl.getExtension('EXT_color_buffer_float');
if (!extFloat) { document.body.innerHTML = '<p style="color:#fff;padding:20px">Este navegador no soporta texturas float renderizables (EXT_color_buffer_float).</p>'; throw new Error('no float ext'); }

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function compile(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    throw new Error('shader compile error');
  }
  return s;
}
function link(vsSrc, fsSrc){
  const vs = compile(vsSrc, gl.VERTEX_SHADER);
  const fs = compile(fsSrc, gl.FRAGMENT_SHADER);
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw new Error('program link error');
  }
  return p;
}

const FULLSCREEN_VERT = `#version 300 es
in vec2 aPosition;
void main(){ gl_Position = vec4(aPosition,0.0,1.0); }`;

// ═══════════════════════════════════════════════════════════════
// AGENT_UPDATE — cada uno de los 65.536 agentes de Physarum sensa
// su rastro local Y, además, es empujado por dos campos causales
// que nacen de la posición real de Sisón y de Luis7Lunes:
//   · Sisón  → geometría ordenada (espiral + anillos) centrada en
//              SU posición, con intensidad uSacredPull y radio de
//              alcance uInfluenceRadius. Donde Sisón no llega, el
//              orden no existe.
//   · Luis7Lunes → perturbación aleatoria centrada en SU posición,
//              con intensidad uProfaneChaos y el mismo radio.
// La "profanación" (Space) sigue siendo un gesto global aparte: una
// ruptura instantánea que no pertenece a ninguna de las dos
// entidades, sino a la performance misma.
// ═══════════════════════════════════════════════════════════════
const AGENT_UPDATE_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uAgentState;
uniform sampler2D uTrailMap;
uniform vec2 uAgentTexSize;
uniform vec2 uTrailTexSize;
uniform float uSensorDistance;
uniform float uSensorAngle;
uniform float uRotationAngle;
uniform float uMoveDistance;
uniform float uTime;
uniform vec2 uSisonPos;
uniform vec2 uLuisPos;
uniform float uSacredPull;
uniform float uProfaneChaos;
uniform float uInfluenceRadius;
uniform float uProfanationStrength;
out vec4 fragColor;
const float TWO_PI = 6.28318530718;
const float PI = 3.14159265359;

float hash(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float senseTrail(vec2 pos, float heading, float angleOffset){
  float ang = heading + angleOffset;
  vec2 dir = vec2(cos(ang), sin(ang));
  vec2 samplePos = pos + dir * (uSensorDistance / uTrailTexSize);
  samplePos = fract(samplePos + 1.0);
  return texture(uTrailMap, samplePos).r;
}

// geometría del orden: espiral + anillos concéntricos, pero ahora
// centrada en la posición real de Sisón, no en el centro del lienzo.
// Sisón no representa lo sagrado: lo sagrado existe porque Sisón
// está ahí.
float sacredFieldAngle(vec2 p, vec2 center){
  vec2 d = p - center;
  float dist = length(d);
  float baseAngle = atan(d.y, d.x);
  float spiralTwist = 3.0;
  float ringFreq = 10.0;
  float ringAmp = 0.35;
  return baseAngle + 1.5707963 + spiralTwist*dist*TWO_PI*0.3 + ringAmp*sin(dist*ringFreq*TWO_PI);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uAgentTexSize;
  vec4 state = texture(uAgentState, uv);
  vec2 pos = state.rg;
  float heading = state.b * TWO_PI;

  float left   = senseTrail(pos, heading,  uSensorAngle);
  float center = senseTrail(pos, heading,  0.0);
  float right  = senseTrail(pos, heading, -uSensorAngle);
  float rnd = hash(uv + uTime);

  if (center > left && center > right) {
  } else if (left > right) {
    heading += uRotationAngle;
  } else if (right > left) {
    heading -= uRotationAngle;
  } else if (left == right && center <= left) {
    heading += (rnd > 0.5 ? uRotationAngle : -uRotationAngle);
  }

  // tirón de Sisón: solo existe cerca de donde él está parado ahora.
  float distToSison = length(pos - uSisonPos);
  float sisonFalloff = exp(-distToSison / max(uInfluenceRadius, 0.02));
  float sacredAngle = sacredFieldAngle(pos, uSisonPos);
  float diff = atan(sin(sacredAngle - heading), cos(sacredAngle - heading));
  heading += diff * uSacredPull * sisonFalloff * 0.14;

  // caos de Luis7Lunes: solo existe cerca de donde él está parado ahora.
  float distToLuis = length(pos - uLuisPos);
  float luisFalloff = exp(-distToLuis / max(uInfluenceRadius, 0.02));
  float rnd3 = hash(uv*2.3 + uTime*4.0 + uLuisPos);
  heading += (rnd3 - 0.5) * uProfaneChaos * luisFalloff * TWO_PI * 0.4;

  // profanación: ráfaga global, el gesto en vivo (Space), ajeno a ambos.
  float rnd2 = hash(uv*1.7 + uTime*7.0);
  heading += (rnd2 - 0.5) * uProfanationStrength * TWO_PI * 0.5;

  vec2 dir = vec2(cos(heading), sin(heading));
  vec2 newPos = fract(pos + dir * (uMoveDistance / uTrailTexSize) + 1.0);
  float newHeadingN = mod(heading, TWO_PI) / TWO_PI;
  fragColor = vec4(newPos, newHeadingN, state.a);
}`;

const DEPOSIT_VERT = `#version 300 es
precision highp float;
uniform sampler2D uAgentState;
uniform ivec2 uAgentTexSize;
void main(){
  int x = gl_VertexID % uAgentTexSize.x;
  int y = gl_VertexID / uAgentTexSize.x;
  vec4 state = texelFetch(uAgentState, ivec2(x,y), 0);
  vec2 clip = state.rg * 2.0 - 1.0;
  gl_Position = vec4(clip, 0.0, 1.0);
  gl_PointSize = 1.0;
}`;

const DEPOSIT_FRAG = `#version 300 es
precision highp float;
uniform float uDepositAmount;
out vec4 fragColor;
void main(){ fragColor = vec4(uDepositAmount, 0.0, 0.0, 1.0); }`;

// ═══════════════════════════════════════════════════════════════
// ENTITY_DEPOSIT — Sisón y Luis7Lunes no son un dibujo flotando
// sobre el rastro: cada uno inyecta directamente su propia marca
// en el mapa de rastro, en el punto exacto donde están. El rastro
// que ves no solo es producido por los 65.536 agentes: también es
// producido por ellos.
// ═══════════════════════════════════════════════════════════════
const ENTITY_DEPOSIT_VERT = `#version 300 es
precision highp float;
uniform vec2 uPos;
void main(){
  vec2 clip = uPos * 2.0 - 1.0;
  gl_Position = vec4(clip, 0.0, 1.0);
  gl_PointSize = 30.0;
}`;

const ENTITY_DEPOSIT_FRAG = `#version 300 es
precision highp float;
uniform float uAmount;
out vec4 fragColor;
void main(){
  vec2 c = gl_PointCoord - vec2(0.5);
  float d = length(c) * 2.0;
  float falloff = smoothstep(1.0, 0.0, d);
  fragColor = vec4(uAmount * falloff, 0.0, 0.0, 1.0);
}`;

const DIFFUSE_DECAY_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTrailMap;
uniform vec2 uTrailTexSize;
uniform float uDecay;
out vec4 fragColor;
void main(){
  vec2 uv = gl_FragCoord.xy / uTrailTexSize;
  vec2 texel = 1.0 / uTrailTexSize;
  float sum = 0.0;
  for(int dx=-1; dx<=1; dx++){
    for(int dy=-1; dy<=1; dy++){
      vec2 offset = vec2(float(dx), float(dy)) * texel;
      sum += texture(uTrailMap, fract(uv+offset+1.0)).r;
    }
  }
  float blurred = sum / 9.0;
  fragColor = vec4(blurred * uDecay, 0.0, 0.0, 1.0);
}`;

// ═══════════════════════════════════════════════════════════════
// DISPLAY — además de pintar el mapa de rastro, dibuja a Sisón y
// Luis7Lunes como dos singularidades abstractas: un núcleo que se
// oscurece casi hasta el negro (horizonte de eventos) y un halo que
// pulsa o parpadea alrededor, y además DEFORMA el muestreo del
// rastro hacia cada centro (un lente gravitacional elemental), para
// que se sienta que el espacio mismo se curva alrededor de ellos.
// Sisón: halo verde-azulado (teal), frío y estable (orden). Luis7Lunes:
// halo carmesí-vino, oscuro, que parpadea sin ritmo (caos). Ambos
// colores nacen de la misma paleta oscura/ámbar de la obra —
// contraste cromático, no choque "neón". Ningún texto, ningún
// ícono literal.
// ═══════════════════════════════════════════════════════════════
const DISPLAY_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTrailMap;
uniform vec2 uSisonPos;
uniform vec2 uLuisPos;
uniform float uInfluenceRadius;
uniform float uSacredPull;
uniform float uProfaneChaos;
uniform float uTime;
uniform float uStarted;
out vec4 fragColor;

vec2 warpToward(vec2 uv, vec2 center, float radius, float strength){
  vec2 d = uv - center;
  float dist = length(d);
  float pull = exp(-dist / max(radius,0.001)) * strength * 0.5;
  return uv - normalize(d + 1e-5) * pull * 0.08;
}

void main(){
  vec2 uv = gl_FragCoord.xy / vec2(textureSize(uTrailMap,0));

  vec2 warpedUV = uv;
  warpedUV = warpToward(warpedUV, uSisonPos, uInfluenceRadius, uSacredPull);
  warpedUV = warpToward(warpedUV, uLuisPos, uInfluenceRadius, uProfaneChaos);
  warpedUV = fract(warpedUV + 1.0);

  float t = clamp(texture(uTrailMap, warpedUV).r, 0.0, 1.0);
  t = pow(t, 0.55);
  vec3 dark = vec3(0.02,0.015,0.02);
  vec3 mid  = vec3(0.55,0.22,0.08);
  vec3 hot  = vec3(1.0,0.78,0.35);
  vec3 col = mix(dark, mid, clamp(t*2.0,0.0,1.0));
  col = mix(col, hot, clamp((t-0.5)*2.0,0.0,1.0));

  float dSison = length(uv - uSisonPos);
  float coreSison = smoothstep(uInfluenceRadius*0.16, uInfluenceRadius*0.02, dSison) * uStarted;
  float ringSison = smoothstep(uInfluenceRadius*0.85, uInfluenceRadius*0.18, dSison) * (1.0-coreSison);
  float pulseSison = 0.55 + 0.45*sin(dSison*50.0 - uTime*1.5);
  vec3 haloSison = vec3(0.22,0.62,0.62) * ringSison * pulseSison * (0.4+0.6*uSacredPull) * uStarted;
  col = mix(col, vec3(0.0), coreSison*0.92);
  col += haloSison;

  float dLuis = length(uv - uLuisPos);
  float coreLuis = smoothstep(uInfluenceRadius*0.16, uInfluenceRadius*0.02, dLuis) * uStarted;
  float flicker = 0.5 + 0.5*sin(uTime*11.0 + dLuis*80.0);
  float ringLuis = smoothstep(uInfluenceRadius*0.85, uInfluenceRadius*0.18, dLuis) * (1.0-coreLuis) * flicker;
  vec3 haloLuis = vec3(0.68,0.10,0.22) * ringLuis * (0.4+0.6*uProfaneChaos) * uStarted;
  col = mix(col, vec3(0.0), coreLuis*0.92);
  col += haloLuis;

  fragColor = vec4(col, 1.0);
}`;

const progAgentUpdate = link(FULLSCREEN_VERT, AGENT_UPDATE_FRAG);
const progDeposit = link(DEPOSIT_VERT, DEPOSIT_FRAG);
const progEntityDeposit = link(ENTITY_DEPOSIT_VERT, ENTITY_DEPOSIT_FRAG);
const progDiffuseDecay = link(FULLSCREEN_VERT, DIFFUSE_DECAY_FRAG);
const progDisplay = link(FULLSCREEN_VERT, DISPLAY_FRAG);

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindQuad(prog){
  const loc = gl.getAttribLocation(prog, 'aPosition');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

// ---- tamaños ----
const AGENT_TEX_W = 256, AGENT_TEX_H = 256; // 65536 agentes
const N_AGENTS = AGENT_TEX_W * AGENT_TEX_H;
const TRAIL_W = 900, TRAIL_H = 900;

function makeFloatTexture(w, h, data){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
function makeFBO(tex){
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return fbo;
}

// estado inicial de agentes: posiciones random, heading random
const initData = new Float32Array(N_AGENTS * 4);
for(let i=0;i<N_AGENTS;i++){
  initData[i*4+0] = Math.random();
  initData[i*4+1] = Math.random();
  initData[i*4+2] = Math.random();
  initData[i*4+3] = 0.0;
}
let agentTexA = makeFloatTexture(AGENT_TEX_W, AGENT_TEX_H, initData);
let agentTexB = makeFloatTexture(AGENT_TEX_W, AGENT_TEX_H, null);
let agentFboA = makeFBO(agentTexA);
let agentFboB = makeFBO(agentTexB);

let trailTexA = makeFloatTexture(TRAIL_W, TRAIL_H, null);
let trailTexB = makeFloatTexture(TRAIL_W, TRAIL_H, null);
let trailFboA = makeFBO(trailTexA);
let trailFboB = makeFBO(trailTexB);

gl.bindFramebuffer(gl.FRAMEBUFFER, null);

// ═══════════════════════════════════════════════════════════════
// Parámetros de sensado del Physarum (SD/SA/RA/MD): quedan fijos.
// Ya no son lo que el performer toca — son el "cuerpo" técnico del
// sistema, afinado una vez. Lo que el performer controla en vivo
// son las CARACTERÍSTICAS de Sisón y Luis7Lunes (abajo).
// ═══════════════════════════════════════════════════════════════
const FIXED_SENSOR = { sd:9, sa:0.5, ra:0.4, md:1.5 };

// ═══════════════════════════════════════════════════════════════
// Controles en vivo por teclado — las mismas teclas de siempre,
// pero ahora cada una es una característica de Sisón o de
// Luis7Lunes (o de su relación), no un parámetro abstracto del
// algoritmo. Mantener presionada la tecla desliza el valor de
// forma continua, como un fader real.
//   SISÓN (orden)      sube Q / baja A
//   LUIS7LUNES (caos)  sube W / baja S
//   TENSIÓN entre ambos sube E / baja D
//   VELOCIDAD de ambos sube R / baja F
//   PERSISTENCIA del rastro sube ↑ / baja ↓
//   RADIO DE INFLUENCIA sube T / baja G
//   Space = profanación (ruptura global, instantánea)
// ═══════════════════════════════════════════════════════════════
const params = {
  sacredPull: 0.5,
  profaneChaos: 0.5,
  tension: 1.0,
  entitySpeed: 1.0,
  decay: 0.94,
  influenceRadius: 0.18,
  profanationStrength: 0.0,
};
const KEY_BINDINGS = {
  q:{param:'sacredPull',   dir: 1}, a:{param:'sacredPull',   dir:-1},
  w:{param:'profaneChaos', dir: 1}, s:{param:'profaneChaos', dir:-1},
  e:{param:'tension',      dir: 1}, d:{param:'tension',      dir:-1},
  r:{param:'entitySpeed',  dir: 1}, f:{param:'entitySpeed',  dir:-1},
  arrowup:{param:'decay',  dir: 1}, arrowdown:{param:'decay', dir:-1},
  t:{param:'influenceRadius', dir: 1}, g:{param:'influenceRadius', dir:-1},
};
const PARAM_RANGES = {
  sacredPull:      { min:0,    max:1.6,  ratePerSec:0.7  },
  profaneChaos:    { min:0,    max:1.6,  ratePerSec:0.7  },
  tension:         { min:0.05, max:3.0,  ratePerSec:1.2  },
  entitySpeed:     { min:0.3,  max:3.0,  ratePerSec:1.1  },
  decay:           { min:0.85, max:0.99, ratePerSec:0.05 },
  influenceRadius: { min:0.04, max:0.35, ratePerSec:0.18 },
};
let profanationTriggerTime = -99999;
const PROFANATION_DECAY_MS = 1400;

const heldKeys = new Set();
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (KEY_BINDINGS[k]) { heldKeys.add(k); e.preventDefault(); }
  if (e.code === 'Space') { profanationTriggerTime = performance.now(); e.preventDefault(); }
  if (k === 'h') { toggleHud(); e.preventDefault(); }
  if (k === 'j') { toggleFullscreen(); e.preventDefault(); }
  if (e.key === 'Enter') { startMusic(); e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  heldKeys.delete(e.key.toLowerCase());
});

// ═══════════════════════════════════════════════════════════════
// Música — ENTER inicia assets/musica.mp3. Es la interacción
// explícita del usuario que el navegador exige para desbloquear
// audio. No se reinicia si ya está sonando. El HUD puede consultar
// bgm.paused para saber si está reproduciéndose; currentTime queda
// disponible para una futura sincronización evento-a-evento.
// ═══════════════════════════════════════════════════════════════
const bgm = document.getElementById('bgm');
const startHint = document.getElementById('startHint');
let musicStarted = false;
// La obra no existe antes de la música: el lienzo arranca vacío
// (el trail map se crea en ceros) y la simulación entera — agentes,
// Sisón, Luis7Lunes, deposito, difusión — está pausada hasta que
// `started` se vuelve true. Solo entonces empiezan a "pintar".
let started = false;
function startMusic(){
  if (musicStarted) return;
  musicStarted = true;
  bgm.currentTime = 0;
  bgm.play().then(() => {
    startHint.style.opacity = '0';
    started = true;
  }).catch(() => {
    musicStarted = false; // el navegador la bloqueó: permitir reintentar
  });
}

// ═══════════════════════════════════════════════════════════════
// HUD (H) — panel de solo lectura con el estado de cada
// característica en vivo. J — pantalla completa.
// ═══════════════════════════════════════════════════════════════
const hud = document.getElementById('hud');
const hudEls = {
  sd: document.getElementById('hud-sd'),
  sa: document.getElementById('hud-sa'),
  ra: document.getElementById('hud-ra'),
  md: document.getElementById('hud-md'),
  decay: document.getElementById('hud-decay'),
  sacred: document.getElementById('hud-sacred'),
  profanation: document.getElementById('hud-profanation'),
  music: document.getElementById('hud-music'),
};
let hudVisible = false;
function toggleHud(){
  hudVisible = !hudVisible;
  hud.style.display = hudVisible ? 'block' : 'none';
}
function updateHud(){
  if (!hudVisible) return;
  hudEls.sd.textContent = params.sacredPull.toFixed(2);
  hudEls.sa.textContent = params.profaneChaos.toFixed(2);
  hudEls.ra.textContent = params.tension.toFixed(2);
  hudEls.md.textContent = params.entitySpeed.toFixed(2);
  hudEls.decay.textContent = params.decay.toFixed(3);
  hudEls.sacred.textContent = params.influenceRadius.toFixed(2);
  hudEls.profanation.textContent = params.profanationStrength.toFixed(2);
  hudEls.music.textContent = musicStarted && !bgm.paused ? '▶' : '—';
}
function toggleFullscreen(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}

function applyKeyboardControls(dt){
  for (const k of heldKeys){
    const bind = KEY_BINDINGS[k];
    const range = PARAM_RANGES[bind.param];
    let v = params[bind.param] + bind.dir * range.ratePerSec * dt;
    v = Math.min(range.max, Math.max(range.min, v));
    params[bind.param] = v;
  }
  const elapsed = performance.now() - profanationTriggerTime;
  params.profanationStrength = Math.max(0, 1 - elapsed / PROFANATION_DECAY_MS);
}

const startTime = performance.now();
let lastFrameTime = startTime;

// ═══════════════════════════════════════════════════════════════
// Sisón y Luis7Lunes — ya no son una capa decorativa sobre el
// Physarum: sus posiciones SON los centros de los campos que leen
// los 65.536 agentes (ver AGENT_UPDATE_FRAG) y SON los puntos donde
// se inyecta rastro directamente (ver ENTITY_DEPOSIT). No se
// dibujan como puntos con nombre: se visualizan como singularidades
// abstractas dentro del propio shader de despliegue (DISPLAY_FRAG).
//
// Sisón es orden: avanza en una procesión circular alrededor del
// centro del lienzo — un camino predecible y ritual. Su velocidad
// angular depende de TENSIÓN y VELOCIDAD.
//
// Luis7Lunes es caos: deambula sin ruta fija (wander), y es atraído
// u obligado a separarse de Sisón según TENSIÓN y la distancia entre
// ambos. La profanación (Space) lo sacude a él con más fuerza que a
// Sisón — es su gesto.
// ═══════════════════════════════════════════════════════════════
class Entity {
  constructor(role, startX, startY){
    this.role = role; // 'sacred' (Sisón) | 'profane' (Luis7Lunes)
    this.pos = {x:startX, y:startY};
    this.heading = Math.random()*Math.PI*2;
    this.orbitAngle = Math.atan2(startY-0.5, startX-0.5);
    this.wanderAngle = Math.random()*Math.PI*2;
  }
  update(dt, other){
    if (this.role === 'sacred'){
      const center = {x:0.5, y:0.5};
      const orbitRadius = 0.28;
      this.orbitAngle += params.tension * 0.4 * dt * params.entitySpeed;
      const targetX = center.x + Math.cos(this.orbitAngle) * orbitRadius;
      const targetY = center.y + Math.sin(this.orbitAngle) * orbitRadius;
      this.pos.x += (targetX - this.pos.x) * Math.min(1, dt * 3.0);
      this.pos.y += (targetY - this.pos.y) * Math.min(1, dt * 3.0);
    } else {
      this.wanderAngle += (Math.random()-0.5) * 2.6 * dt;
      this.heading += (this.wanderAngle - this.heading) * dt * 1.5;

      const dx = other.pos.x - this.pos.x, dy = other.pos.y - this.pos.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 0.0001;
      const toward = Math.atan2(dy, dx);
      const pullSign = dist < 0.1 ? -1 : 1; // muy cerca: se aleja
      let odiff = toward - this.heading;
      odiff = Math.atan2(Math.sin(odiff), Math.cos(odiff));
      this.heading += odiff * pullSign * params.tension * 0.25 * dt;

      const speed = 0.11 * params.entitySpeed;
      this.pos.x += Math.cos(this.heading) * speed * dt;
      this.pos.y += Math.sin(this.heading) * speed * dt;
    }

    // profanación: sacude a ambos, a Luis7Lunes más que a Sisón.
    const kick = (this.role === 'profane' ? 1.0 : 0.35) * params.profanationStrength;
    if (kick > 0){
      this.pos.x += (Math.random()-0.5) * kick * 0.05;
      this.pos.y += (Math.random()-0.5) * kick * 0.05;
    }

    this.pos.x = (this.pos.x % 1 + 1) % 1;
    this.pos.y = (this.pos.y % 1 + 1) % 1;
  }
}

const sison = new Entity('sacred', 0.78, 0.5);
const luis7lunes = new Entity('profane', 0.3, 0.7);

function stepAgents(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, agentFboB);
  gl.viewport(0,0,AGENT_TEX_W,AGENT_TEX_H);
  gl.useProgram(progAgentUpdate);
  bindQuad(progAgentUpdate);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, agentTexA);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, trailTexA);
  gl.uniform1i(gl.getUniformLocation(progAgentUpdate,'uAgentState'), 0);
  gl.uniform1i(gl.getUniformLocation(progAgentUpdate,'uTrailMap'), 1);
  gl.uniform2f(gl.getUniformLocation(progAgentUpdate,'uAgentTexSize'), AGENT_TEX_W, AGENT_TEX_H);
  gl.uniform2f(gl.getUniformLocation(progAgentUpdate,'uTrailTexSize'), TRAIL_W, TRAIL_H);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uSensorDistance'), FIXED_SENSOR.sd);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uSensorAngle'), FIXED_SENSOR.sa);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uRotationAngle'), FIXED_SENSOR.ra);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uMoveDistance'), FIXED_SENSOR.md);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uTime'), (performance.now()-startTime)/1000.0);
  gl.uniform2f(gl.getUniformLocation(progAgentUpdate,'uSisonPos'), sison.pos.x, sison.pos.y);
  gl.uniform2f(gl.getUniformLocation(progAgentUpdate,'uLuisPos'), luis7lunes.pos.x, luis7lunes.pos.y);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uSacredPull'), params.sacredPull);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uProfaneChaos'), params.profaneChaos);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uInfluenceRadius'), params.influenceRadius);
  gl.uniform1f(gl.getUniformLocation(progAgentUpdate,'uProfanationStrength'), params.profanationStrength);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  [agentTexA, agentTexB] = [agentTexB, agentTexA];
  [agentFboA, agentFboB] = [agentFboB, agentFboA];
}

function depositAgents(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, trailFboA);
  gl.viewport(0,0,TRAIL_W,TRAIL_H);
  gl.useProgram(progDeposit);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, agentTexA);
  gl.uniform1i(gl.getUniformLocation(progDeposit,'uAgentState'), 0);
  gl.uniform2i(gl.getUniformLocation(progDeposit,'uAgentTexSize'), AGENT_TEX_W, AGENT_TEX_H);
  gl.uniform1f(gl.getUniformLocation(progDeposit,'uDepositAmount'), 0.08);
  gl.drawArrays(gl.POINTS, 0, N_AGENTS);
  gl.disable(gl.BLEND);
}

function depositEntities(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, trailFboA);
  gl.viewport(0,0,TRAIL_W,TRAIL_H);
  gl.useProgram(progEntityDeposit);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);

  gl.uniform2f(gl.getUniformLocation(progEntityDeposit,'uPos'), sison.pos.x, sison.pos.y);
  gl.uniform1f(gl.getUniformLocation(progEntityDeposit,'uAmount'), 0.12 + 0.3*params.sacredPull);
  gl.drawArrays(gl.POINTS, 0, 1);

  gl.uniform2f(gl.getUniformLocation(progEntityDeposit,'uPos'), luis7lunes.pos.x, luis7lunes.pos.y);
  gl.uniform1f(gl.getUniformLocation(progEntityDeposit,'uAmount'), 0.12 + 0.3*params.profaneChaos);
  gl.drawArrays(gl.POINTS, 0, 1);

  gl.disable(gl.BLEND);
}

function diffuseDecay(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, trailFboB);
  gl.viewport(0,0,TRAIL_W,TRAIL_H);
  gl.useProgram(progDiffuseDecay);
  bindQuad(progDiffuseDecay);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trailTexA);
  gl.uniform1i(gl.getUniformLocation(progDiffuseDecay,'uTrailMap'), 0);
  gl.uniform2f(gl.getUniformLocation(progDiffuseDecay,'uTrailTexSize'), TRAIL_W, TRAIL_H);
  gl.uniform1f(gl.getUniformLocation(progDiffuseDecay,'uDecay'), params.decay);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  [trailTexA, trailTexB] = [trailTexB, trailTexA];
  [trailFboA, trailFboB] = [trailFboB, trailFboA];
}

function display(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(progDisplay);
  bindQuad(progDisplay);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trailTexA);
  gl.uniform1i(gl.getUniformLocation(progDisplay,'uTrailMap'), 0);
  // Antes de ENTER, ni el rastro ni las singularidades existen todavía:
  // el lienzo debe verse completamente vacío, en silencio.
  gl.uniform2f(gl.getUniformLocation(progDisplay,'uSisonPos'), sison.pos.x, sison.pos.y);
  gl.uniform2f(gl.getUniformLocation(progDisplay,'uLuisPos'), luis7lunes.pos.x, luis7lunes.pos.y);
  gl.uniform1f(gl.getUniformLocation(progDisplay,'uInfluenceRadius'), params.influenceRadius);
  gl.uniform1f(gl.getUniformLocation(progDisplay,'uSacredPull'), started ? params.sacredPull : 0.0);
  gl.uniform1f(gl.getUniformLocation(progDisplay,'uProfaneChaos'), started ? params.profaneChaos : 0.0);
  gl.uniform1f(gl.getUniformLocation(progDisplay,'uStarted'), started ? 1.0 : 0.0);
  gl.uniform1f(gl.getUniformLocation(progDisplay,'uTime'), (performance.now()-startTime)/1000.0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function frame(){
  const now = performance.now();
  const dt = Math.min((now - lastFrameTime) / 1000, 1/20);
  lastFrameTime = now;

  applyKeyboardControls(dt);
  updateHud();

  if (started){
    sison.update(dt, luis7lunes);
    luis7lunes.update(dt, sison);
    stepAgents();
    depositAgents();
    depositEntities();
    diffuseDecay();
  }
  display();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
